<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finora — Personal Money Tracker</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">Finora</h1>
    <p class="app-subtitle">Personal Money Tracker</p>
  </header>

  <main class="app-main">

    <!-- Dashboard section — baad mein bharenge -->
    <section id="dashboard-section" class="page-section">
      <h2>Dashboard</h2>
      <p class="placeholder-text">Dashboard yahan aayega.</p>
    </section>

    <!-- History section — baad mein bharenge -->
    <section id="history-section" class="page-section" hidden>
      <h2>History</h2>
      <p class="placeholder-text">Transaction history yahan aayegi.</p>
    </section>

    <!-- Forms section — baad mein bharenge -->
    <section id="form-section" class="page-section" hidden>
      <h2>Add Transaction</h2>
      <p class="placeholder-text">Form yahan aayega.</p>
    </section>

  </main>

  <footer class="app-footer">
    <p>Finora v0.1 — Local data only. Regular backup karein.</p>
  </footer>

  <script type="module" src="js/app.js"></script>

</body>
</html>
